name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string (e.g., 1.6.0) for manual builds'
        required: false
        default: '0.0.0-dev'

permissions:
  contents: write

jobs:
  # ==================================================================
  # macOS Build Job
  # ==================================================================
  build-macos:
    name: Build macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
            ffmpeg_asset: ffmpeg-osx-arm64.zip
            binary_dir: macos_silicon

          - arch: x64
            runner: macos-15-intel
            ffmpeg_asset: ffmpeg-osx-x64.zip
            binary_dir: macos_intel

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Determine version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version || '0.0.0-dev' }}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Release version: $VERSION"

      - name: Generate version file
        run: |
          cat > src/generated_version.py <<EOF
          APP_VERSION = "$VERSION"
          EOF
          echo "Generated version file contents:"
          cat src/generated_version.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download FFmpeg
        run: |
          mkdir -p "build_binaries/${{ matrix.binary_dir }}"
          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            "https://github.com/Tyrrrz/FFmpegBin/releases/latest/download/${{ matrix.ffmpeg_asset }}" \
            --output ffmpeg.zip

          unzip -q ffmpeg.zip -d ffmpeg_extract
          echo "Downloaded FFmpeg files:"
          find ffmpeg_extract -type f -print

      - name: Install FFmpeg binaries
        run: |
          FF_DIR="build_binaries/${{ matrix.binary_dir }}"

          FFPROBE_PATH="$(find ffmpeg_extract -type f -name ffprobe -print -quit)"
          FFMPEG_PATH="$(find ffmpeg_extract -type f -name ffmpeg -print -quit)"

          if [ -z "$FFPROBE_PATH" ]; then
            echo "ERROR: ffprobe was not found in FFmpeg archive"
            exit 1
          fi

          if [ -z "$FFMPEG_PATH" ]; then
            echo "ERROR: ffmpeg was not found in FFmpeg archive"
            exit 1
          fi

          cp "$FFPROBE_PATH" "$FF_DIR/ffprobe"
          cp "$FFMPEG_PATH" "$FF_DIR/ffmpeg"

          chmod +x "$FF_DIR/ffprobe"
          chmod +x "$FF_DIR/ffmpeg"

          echo "Installed binaries in $FF_DIR:"
          ls -lh "$FF_DIR"

      - name: Verify FFmpeg architecture
        run: |
          FF_DIR="build_binaries/${{ matrix.binary_dir }}"
          echo "ffmpeg info:"
          file "$FF_DIR/ffmpeg"
          lipo -archs "$FF_DIR/ffmpeg" || true

          echo "ffprobe info:"
          file "$FF_DIR/ffprobe"
          lipo -archs "$FF_DIR/ffprobe" || true

      - name: Build application
        run: |
          pyinstaller \
            --noconfirm \
            --clean \
            "Snowsky Echo Mini Toolbox.spec"

      - name: Verify application bundle
        run: |
          APP="dist/Snowsky Echo Mini Toolbox.app"
          if [ ! -d "$APP" ]; then
            echo "ERROR: application bundle was not created"
            exit 1
          fi
          echo "Application bundle created at: $APP"
          echo "Verifying bundled FFmpeg and ffprobe:"
          find "$APP" -name ffmpeg -o -name ffprobe

      - name: Create DMG
        run: |
          APP_NAME="Snowsky Echo Mini Toolbox"
          APP_SLUG="snowsky-echo-mini-toolbox"
          STAGE_DIR="dist/dmg_stage"
          DMG="dist/${APP_SLUG}-${VERSION}-macOS-${{ matrix.arch }}.dmg"

          rm -rf "$STAGE_DIR"
          mkdir -p "$STAGE_DIR"

          cp -R "dist/${APP_NAME}.app" "$STAGE_DIR/"
          ln -s /Applications "$STAGE_DIR/Applications"

          hdiutil create \
            -volname "$APP_NAME" \
            -srcfolder "$STAGE_DIR" \
            -ov \
            -format UDZO \
            "$DMG"

          rm -rf "$STAGE_DIR"
          echo "Created DMG at: $DMG"
          ls -lh "$DMG"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  # ==================================================================
  # Windows Build Job
  # ==================================================================
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Determine version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $VERSION = "${{ github.ref_name }}".TrimStart('v')
          } else {
            $VERSION = "${{ inputs.version }}"
            if ([string]::IsNullOrEmpty($VERSION)) { $VERSION = "0.0.0-dev" }
          }
          Add-Content -Path $env:GITHUB_ENV -Value "VERSION=$VERSION"
          Write-Host "Release version: $VERSION"

      - name: Generate version file
        shell: pwsh
        run: |
          Set-Content -Path src/generated_version.py -Value "APP_VERSION = `"$env:VERSION`""
          Write-Host "Generated version file contents:"
          Get-Content -Path src/generated_version.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download FFmpeg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "build_binaries/windows_x64" | Out-Null
          curl -fL "https://github.com/Tyrrrz/FFmpegBin/releases/latest/download/ffmpeg-windows-x64.zip" -o ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_extract -Force
          Write-Host "Downloaded and extracted FFmpeg files:"
          Get-ChildItem -Path ffmpeg_extract -Recurse

      - name: Install FFmpeg binaries
        shell: pwsh
        run: |
          $FF_DIR = "build_binaries/windows_x64"
          $FFPROBE_PATH = (Get-ChildItem -Path ffmpeg_extract -Filter ffprobe.exe -Recurse | Select-Object -First 1).FullName
          $FFMPEG_PATH = (Get-ChildItem -Path ffmpeg_extract -Filter ffmpeg.exe -Recurse | Select-Object -First 1).FullName

          if ([string]::IsNullOrEmpty($FFPROBE_PATH)) {
            Write-Error "ERROR: ffprobe.exe was not found in FFmpeg archive"
            exit 1
          }
          if ([string]::IsNullOrEmpty($FFMPEG_PATH)) {
            Write-Error "ERROR: ffmpeg.exe was not found in FFmpeg archive"
            exit 1
          }

          Copy-Item $FFPROBE_PATH "$FF_DIR\ffprobe.exe" -Force
          Copy-Item $FFMPEG_PATH "$FF_DIR\ffmpeg.exe" -Force

          Write-Host "Installed binaries in ${FF_DIR}:"
          Get-ChildItem $FF_DIR

      - name: Build application
        run: |
          pyinstaller --noconfirm --clean "Snowsky Echo Mini Toolbox.spec"

      - name: Verify application
        shell: pwsh
        run: |
          $BUILT_EXE = "dist\Snowsky Echo Mini Toolbox\Snowsky Echo Mini Toolbox.exe"
          if (-not (Test-Path $BUILT_EXE)) {
            Write-Error "ERROR: application executable was not created"
            exit 1
          }
          Write-Host "Application executable created at: $BUILT_EXE"

      - name: Compile Installer
        run: |
          iscc /DMyOutputDir="${{ github.workspace }}\dist" /DMyOutputBaseFilename="snowsky-echo-mini-toolbox-${{ env.VERSION }}-Windows-Setup" /DMyAppVersion="${{ env.VERSION }}" .\build_assets\windows_installer.iss

      - name: Verify Installer
        shell: pwsh
        run: |
          $SETUP_EXE = Get-ChildItem -Path dist -Filter "*Windows-Setup.exe" | Select-Object -First 1
          if (-not $SETUP_EXE) {
            Write-Error "ERROR: Windows installer executable was not created"
            exit 1
          }
          Write-Host "Installer created at: $($SETUP_EXE.FullName)"

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*Windows-Setup.exe
          if-no-files-found: error

  # ==================================================================
  # Linux Build Job
  # ==================================================================
  build-linux:
    name: Build Linux amd64
    runs-on: ubuntu-22.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Determine version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version || '0.0.0-dev' }}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Release version: $VERSION"

      - name: Generate version file
        run: |
          cat > src/generated_version.py <<EOF
          APP_VERSION = "$VERSION"
          EOF
          echo "Generated version file contents:"
          cat src/generated_version.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download FFmpeg
        run: |
          mkdir -p "build_binaries/linux_amd64"
          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            "https://github.com/Tyrrrz/FFmpegBin/releases/latest/download/ffmpeg-linux-x64.zip" \
            --output ffmpeg.zip

          unzip -q ffmpeg.zip -d ffmpeg_extract
          echo "Downloaded FFmpeg files:"
          find ffmpeg_extract -type f -print

      - name: Install FFmpeg binaries
        run: |
          FF_DIR="build_binaries/linux_amd64"

          FFPROBE_PATH="$(find ffmpeg_extract -type f -name ffprobe -print -quit)"
          FFMPEG_PATH="$(find ffmpeg_extract -type f -name ffmpeg -print -quit)"

          if [ -z "$FFPROBE_PATH" ]; then
            echo "ERROR: ffprobe was not found in FFmpeg archive"
            exit 1
          fi

          if [ -z "$FFMPEG_PATH" ]; then
            echo "ERROR: ffmpeg was not found in FFmpeg archive"
            exit 1
          fi

          cp "$FFPROBE_PATH" "$FF_DIR/ffprobe"
          cp "$FFMPEG_PATH" "$FF_DIR/ffmpeg"

          chmod +x "$FF_DIR/ffprobe"
          chmod +x "$FF_DIR/ffmpeg"

          echo "Installed binaries in $FF_DIR:"
          ls -lh "$FF_DIR"

      - name: Verify FFmpeg architecture
        run: |
          FF_DIR="build_binaries/linux_amd64"
          echo "ffmpeg info:"
          file "$FF_DIR/ffmpeg"

          echo "ffprobe info:"
          file "$FF_DIR/ffprobe"

      - name: Build application
        run: |
          pyinstaller \
            --noconfirm \
            --clean \
            "Snowsky Echo Mini Toolbox.spec"

      - name: Verify application
        run: |
          APP="dist/Snowsky Echo Mini Toolbox"
          if [ ! -d "$APP" ]; then
            echo "ERROR: application directory was not created"
            exit 1
          fi
          echo "Application directory created at: $APP"

      - name: Create tar.gz package
        run: |
          APP_NAME="Snowsky Echo Mini Toolbox"
          APP_SLUG="snowsky-echo-mini-toolbox"
          tar -C dist -czf "dist/${APP_SLUG}-${VERSION}-linux-amd64.tar.gz" "$APP_NAME"
          echo "Created tarball:"
          ls -lh dist/*.tar.gz

      - name: Build Debian package
        run: |
          APP_NAME="Snowsky Echo Mini Toolbox"
          APP_SLUG="snowsky-echo-mini-toolbox"
          DIST_APP_DIR="dist/$APP_NAME"
          PKG_ROOT="dist/deb_pkg_root"
          PKG_NAME="${APP_SLUG}_${VERSION}_amd64.deb"
          PKG_PATH="dist/$PKG_NAME"

          rm -rf "$PKG_ROOT"
          mkdir -p \
              "$PKG_ROOT/DEBIAN" \
              "$PKG_ROOT/opt/$APP_SLUG" \
              "$PKG_ROOT/usr/bin"

          # App binaries
          cp -a "$DIST_APP_DIR/." "$PKG_ROOT/opt/$APP_SLUG/"

          # Launcher wrapper
          cat > "$PKG_ROOT/usr/bin/$APP_SLUG" <<'SH'
          #!/usr/bin/env bash
          exec "/opt/snowsky-echo-mini-toolbox/Snowsky Echo Mini Toolbox" "$@"
          SH
          chmod 0755 "$PKG_ROOT/usr/bin/$APP_SLUG"

          # Control file
          cat > "$PKG_ROOT/DEBIAN/control" <<EOF
          Package: $APP_SLUG
          Version: $VERSION
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Silent Sphinx <115553492+silent-sphinx@users.noreply.github.com>
          Depends: libxkbcommon-x11-0, libxcb-cursor0, libxcb-icccm4, libxcb-image0, libxcb-keysyms1, libxcb-render-util0, libxcb-xkb1
          Description: Snowsky Echo Mini Toolbox
           Desktop tool for preparing music folders and USB drives for Snowsky Echo Mini.
          EOF

          dpkg-deb --build "$PKG_ROOT" "$PKG_PATH"
          rm -rf "$PKG_ROOT"
          echo "Created debian package:"
          ls -lh dist/*.deb

      - name: Upload Linux Packages
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/*.tar.gz
            dist/*.deb
          if-no-files-found: error

  # ==================================================================
  # Create the Unified GitHub Release
  # ==================================================================
  release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && github.event.inputs.version != '0.0.0-dev')

    steps:
      - name: Download ARM64 DMG
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64
          path: release-assets

      - name: Download Intel DMG
        uses: actions/download-artifact@v4
        with:
          name: macos-x64
          path: release-assets

      - name: Download Windows Installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release-assets

      - name: Download Linux Packages
        uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: release-assets

      - name: List release assets
        run: |
          find release-assets -type f -maxdepth 2 -print

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/**/*.dmg
            release-assets/**/*.exe
            release-assets/**/*.tar.gz
            release-assets/**/*.deb
          generate_release_notes: true
